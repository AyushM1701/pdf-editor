server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Support React Router by falling back to index.html
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:* https://*; img-src 'self' data: blob:; worker-src 'self' blob:; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Ensure .mjs files are served with the correct MIME type
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }



    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        
        # Headers to pass along to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events (SSE) streaming
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
    }
}
